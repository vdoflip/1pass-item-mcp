[project]
name = "1pass-item-mcp"
version = "0.1.0"
description = "Bounded MCP server that lets AI agents use individual, allowlisted 1Password items, one approved command at a time, without ever seeing the secret."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vdoflip" }]
requires-python = ">=3.10"
keywords = ["1password", "mcp", "model-context-protocol", "secrets", "claude", "ai-agents", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "onepassword-sdk>=0.4.1,<0.5",
    "pydantic>=2.12,<3",
    "anyio>=4.9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/vdoflip/1pass-item-mcp"
Issues = "https://github.com/vdoflip/1pass-item-mcp/issues"
Changelog = "https://github.com/vdoflip/1pass-item-mcp/blob/main/CHANGELOG.md"

[project.scripts]
1pass-item-mcp = "onepass_item_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.15",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onepass_item_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["onepass_item_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "ASYNC"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLC0415", "ASYNC240", "PT018", "E501"]
# The guard hook must run on the system python3 (3.9 on macOS): no zip(strict=), no pairwise.
"claude-plugin/**" = ["B905", "RUF007"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["onepassword", "onepassword.*", "tomli"]
ignore_missing_imports = true
