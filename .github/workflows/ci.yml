name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term

  guard-hook:
    name: Guard hook on Python 3.9
    # The Claude Code hook runs on the user's system python3 (3.9 on stock macOS).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Deny and allow decisions
        run: |
          run() { printf '%s' "$1" | uv run --no-project --python 3.9 python claude-plugin/hooks/guard.py; }
          out=$(run '{"tool_name":"Bash","tool_input":{"command":"op read op://V/I/f"}}')
          echo "$out" | grep -q '"permissionDecision": "deny"'
          out=$(run '{"tool_name":"Bash","tool_input":{"command":"ls -la"}}')
          test -z "$out"

  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv build
      - name: Installed wheel runs
        run: |
          uv run --isolated --no-project --with dist/*.whl 1pass-item-mcp --version
          uv run --isolated --no-project --with dist/*.whl 1pass-item-mcp init --config "$RUNNER_TEMP/c/config.toml"
          uv run --isolated --no-project --with dist/*.whl 1pass-item-mcp check --config "$RUNNER_TEMP/c/config.toml"
